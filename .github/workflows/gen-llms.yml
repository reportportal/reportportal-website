name: Regenerate llms.txt (manual)

env:
  GTM_ID: GTM-MK7ZHTL
  DOCUMENTATION_URL: http://rpp-docs.s3-website.eu-central-1.amazonaws.com
  CONTENTFUL_ENV_ID: master
  CONTENTFUL_HOST: cdn.contentful.com

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to regenerate llms.txt on (defaults to the selected branch)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target branch
        id: target
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_BRANCH" ]; then
            echo "ref=$INPUT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install of node dependencies
        run: npm install

      - name: create env file
        run: |
          touch .env.production
          echo CONTENTFUL_ACCESS_TOKEN=${{ secrets.CONTENTFUL_ACCESS_TOKEN_DEV }} >> .env.production
          echo CONTENTFUL_SPACE_ID=${{ secrets.CONTENTFUL_SPACE_ID_DEV }} >> .env.production
          echo CONTENTFUL_ENV_ID=${{ env.CONTENTFUL_ENV_ID }} >> .env.production
          echo CONTENTFUL_HOST=${{ env.CONTENTFUL_HOST }} >> .env.production
          echo GTM_ID=${{ env.GTM_ID }} >> .env.production
          echo DOCUMENTATION_URL=${{ env.DOCUMENTATION_URL }} >> .env.production

      - name: Build the source code
        run: npm run build

      - name: Regenerate llms.txt and ai-sitemap.json
        run: node ./bin/gen-llms.js

      - name: Commit regenerated files
        env:
          TARGET_REF: ${{ steps.target.outputs.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add static/llms.txt static/ai-sitemap.json
          if git diff --cached --quiet -- static/llms.txt static/ai-sitemap.json; then
            echo "No changes to llms.txt or ai-sitemap.json — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate llms.txt and ai-sitemap.json [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$TARGET_REF"
