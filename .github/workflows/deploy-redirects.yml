name: Deploy Redirects to Amplify

on:
  push:
    branches:
      - master
    paths:
      - 'src/redirects.json'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-redirects:
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Apply redirects to Amplify
        run: |
          RULES=$(jq '[.[] | {source, target, status} + (if .condition != null and .condition != "" then {condition} else {} end)]' src/redirects.json)
          aws amplify update-app \
            --app-id ${{ secrets.AWS_AMPLIFY_APP_ID }} \
            --region eu-central-1 \
            --custom-rules "$RULES"
          echo "Redirects applied: $(echo "$RULES" | jq 'length') rules"
