<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Two cards (issues) with bidirectional sync arrows -->
  <rect x="4" y="12" width="13" height="13" rx="3" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
  <rect x="23" y="15" width="13" height="13" rx="3" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/>
  <!-- Arrow right (top): card1 → card2 -->
  <path d="M17 17h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M21 15l2 2-2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow left (bottom): card2 → card1 -->
  <path d="M23 25h-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M19 23l-2 2 2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
